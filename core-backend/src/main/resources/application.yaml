spring:
  config:
    import:
      - "${CF_LOCAL_ENV_IMPORT:optional:file:./.env[.properties]}"
      - "classpath:application-database.yaml"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: contextflow-core
server:
  address: ${CF_SERVER_ADDRESS:127.0.0.1}
  port: ${CF_CORE_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
contextflow:
  ai:
    base-url: ${CF_AI_BASE_URL:http://127.0.0.1:8000}
  web:
    allowed-origins: ${CF_WEB_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"
