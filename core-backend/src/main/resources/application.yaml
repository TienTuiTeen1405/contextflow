spring:
  application:
    name: contextflow-core
  datasource:
    url: ${CF_DB_URL:jdbc:postgresql://localhost:15432/contextflow}
    username: ${CF_DB_USERNAME:contextflow}
    password: ${CF_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: contextflow
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: contextflow
    schemas: contextflow
    locations: classpath:db/migration
    clean-disabled: true
server:
  port: ${CF_CORE_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
contextflow:
  ai:
    base-url: ${CF_AI_BASE_URL:http://127.0.0.1:8000}
  web:
    allowed-origins: ${CF_WEB_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"
